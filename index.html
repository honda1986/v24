<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>競艇予想 v24</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap">
<style>
:root{
  --bg:#0B1113; --card:#111A1D; --card2:#0F1719; --line:#26363B;
  --ink:#EAF2EF; --sub:#8CA3A0; --dim:#5E7573;
  --accent:#F2C230; --good:#5FC08B; --bad:#E4726B; --blue:#5AA9E6;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
     font-size:14px;line-height:1.65;padding-bottom:48px}
header{padding:16px 14px 12px;border-bottom:1px solid var(--line);
       background:#0D1518;position:sticky;top:0;z-index:10}
.brand{font-family:var(--mono);font-size:10px;letter-spacing:.22em;
       color:var(--accent);font-weight:800}
h1{font-size:20px;margin:2px 0 4px;font-weight:900;letter-spacing:-.01em}
.lead{font-size:11px;color:var(--sub);margin:0}
.wrap{max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;
      margin:12px 10px;padding:14px}
h2{font-size:13px;margin:0 0 10px;color:var(--accent);font-weight:900;
   letter-spacing:.08em}
.note{font-size:11px;color:var(--sub);margin:0}

/* 成績サマリー */
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.kpi div{background:var(--card2);border:1px solid var(--line);border-radius:9px;
         padding:9px 8px;text-align:center}
.kpi .lab{font-size:9.5px;color:var(--dim);letter-spacing:.06em;display:block}
.kpi .val{font-family:var(--mono);font-size:19px;font-weight:800;
          font-variant-numeric:tabular-nums;display:block;line-height:1.25}
.kpi .val.big{font-size:23px}
.u{font-size:11px;color:var(--sub);font-weight:400}

/* 96% を基準にした帯 */
.gauge{position:relative;height:26px;border:1px solid var(--line);border-radius:7px;
       background:var(--card2);overflow:hidden}
.gauge .fill{position:absolute;inset:0 auto 0 0;background:rgba(95,192,139,.22)}
.gauge .mark{position:absolute;top:0;bottom:0;width:1px;background:var(--accent)}
.gauge .mark::after{content:attr(data-l);position:absolute;top:1px;left:3px;
       font-family:var(--mono);font-size:9px;color:var(--accent);white-space:nowrap}
.gauge .cur{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);
       transform:translateX(-1px)}
.scale{display:flex;justify-content:space-between;font-family:var(--mono);
       font-size:9px;color:var(--dim);margin-top:3px}

/* レース */
.race{border:1px solid var(--line);border-radius:10px;padding:10px 12px;
      margin-bottom:8px;background:var(--card2)}
.race.hit{border-color:var(--good);background:rgba(95,192,139,.07)}
.race.miss{border-color:rgba(228,114,107,.4)}
.rhead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.place{font-weight:900;font-size:15px}
.rno{font-family:var(--mono);font-size:12px;color:var(--sub)}
.tag{font-family:var(--mono);font-size:9.5px;padding:2px 6px;border-radius:5px;
     border:1px solid var(--line);color:var(--sub);letter-spacing:.04em}
.tag.hit{border-color:var(--good);color:var(--good)}
.tag.miss{border-color:var(--bad);color:var(--bad)}
.tag.wait{border-color:var(--blue);color:var(--blue)}
.buys{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.buy{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;
     border:1px solid var(--line);border-radius:6px;padding:3px 7px;background:#0C1416}
.buy.won{border-color:var(--good);background:rgba(95,192,139,.14);color:var(--good)}
.buy .pq{color:var(--accent);font-size:10px;margin-left:5px}
.meta{font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:7px;
      display:flex;gap:10px;flex-wrap:wrap}

/* 見送りの内訳 */
.skips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.skip{font-size:10px;color:var(--sub);border:1px solid var(--line);
      border-radius:5px;padding:2px 7px}
.skip b{font-family:var(--mono);color:var(--ink);font-weight:600;margin-left:4px}

.day{margin-bottom:16px}
.dhead{display:flex;justify-content:space-between;align-items:baseline;
       border-bottom:1px solid var(--line);padding-bottom:5px;margin-bottom:9px}
.dhead h3{font-family:var(--mono);font-size:12px;margin:0;font-weight:800;
          letter-spacing:.04em}
.dsum{font-family:var(--mono);font-size:11px;color:var(--sub);
      font-variant-numeric:tabular-nums}
.empty{color:var(--dim);font-size:12px;padding:6px 0}
.warn{border-color:rgba(242,194,48,.35);background:rgba(242,194,48,.05)}
.warn h2{color:var(--accent)}
.warn p{margin:0 0 6px;font-size:12px;color:var(--sub)}
.warn p:last-child{margin-bottom:0}
.warn b{color:var(--ink)}
footer{text-align:center;font-size:10px;color:var(--dim);padding:8px 14px}
a{color:var(--blue)}
@media (prefers-reduced-motion:no-preference){
  .race{transition:border-color .2s}
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">BOATRACE V24</div>
    <h1>予想ログ</h1>
    <p class="lead" id="lead">読み込み中…</p>
  </div>
</header>

<div class="wrap">

<section class="card" id="sum">
  <h2>成績</h2>
  <div class="kpi">
    <div><span class="lab">回収率</span><span class="val big" id="k-roi">—</span></div>
    <div><span class="lab">的中</span><span class="val" id="k-hit">—</span></div>
    <div><span class="lab">買った点</span><span class="val" id="k-pts">—</span></div>
    <div><span class="lab">収支</span><span class="val" id="k-pl">—</span></div>
  </div>
  <div class="gauge" id="gauge">
    <div class="fill" id="g-fill"></div>
    <div class="mark" id="g-mark" data-l="検証値 96%"></div>
    <div class="cur" id="g-cur"></div>
  </div>
  <div class="scale"><span>75%</span><span>100%</span><span>125%</span></div>
  <p class="note" id="sum-note" style="margin-top:9px"></p>
</section>

<section class="card warn">
  <h2>読むときの前提</h2>
  <p>バックテストの回収率は <b>95.3%</b>（学習に使っていない4,562組）。<b>100%は超えていません。</b></p>
  <p>しかもこれは<b>確定オッズ</b>で測った値です。実際は通知から投票までにオッズが動くので、ここより下がります。</p>
  <p>この画面は、その差がどれだけかを測るためのものです。<b>2週間は買わずに記録だけ</b>取ってください。</p>
</section>

<section class="card">
  <h2>買った記録</h2>
  <div id="days"><p class="empty">まだ記録がありません。</p></div>
</section>

<footer>
  <span id="foot"></span>
</footer>
</div>

<script>
// 見送りの理由は yosou.py が付ける。増えても落とさないよう、
// 決めた順を先に出し、知らないキーはそのあとに続ける。
const SKIP_ORDER = ["波・風","帯の外／p/q不足","データ欠"];
const yen = n => (n<0?"−":"") + "¥" + Math.abs(Math.round(n)).toLocaleString("ja-JP");
const pct = n => (n*100).toFixed(1) + "%";
const fmtDate = d => `${d.slice(0,4)}/${d.slice(4,6)}/${d.slice(6,8)}`;

function el(tag, cls, txt){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(txt !== undefined) e.textContent = txt;
  return e;
}

function render(data){
  const days = (data.days || []).slice().sort((a,b)=> b.date.localeCompare(a.date));
  const picks = days.flatMap(d => (d.picks||[]).map(p => ({...p, date:d.date})));
  const settled = picks.filter(p => p.hit === true || p.hit === false);

  const cost = settled.reduce((s,p)=> s + (p.cost||0), 0);
  const ret  = settled.reduce((s,p)=> s + (p.ret||0), 0);
  const pts  = picks.reduce((s,p)=> s + (p.buys||[]).length, 0);
  const hits = settled.filter(p=>p.hit).length;

  document.getElementById("lead").textContent =
    days.length
      ? `${fmtDate(days[days.length-1].date)} 〜 ${fmtDate(days[0].date)} ／ `
        + `${days.length}日 ${picks.length}レース ${pts}点`
      : "まだ記録がありません";

  const roiEl = document.getElementById("k-roi");
  if(settled.length){
    const roi = ret / cost;
    roiEl.innerHTML = pct(roi).replace("%", '<span class="u">%</span>');
    roiEl.style.color = roi >= 1 ? "var(--good)" : (roi >= 0.9 ? "var(--ink)" : "var(--bad)");
    const at = x => Math.max(0, Math.min(100, (x - 0.75) / 0.5 * 100));
    document.getElementById("g-fill").style.width = at(roi) + "%";
    document.getElementById("g-cur").style.left  = at(roi) + "%";
    document.getElementById("g-mark").style.left = at(0.953) + "%";
    document.getElementById("sum-note").textContent =
      `確定した ${settled.length} レース分。検証値 95.3% との差 `
      + `${((roi-0.953)*100>=0?"+":"")}${((roi-0.953)*100).toFixed(1)}pt。`
      + (settled.length < 60 ? "　※60レースを超えるまでは、ほぼ運の範囲です。" : "");
  }else{
    roiEl.textContent = "—";
    document.getElementById("sum-note").textContent =
      "結果が確定したレースがまだありません。翌日の集計で入ります。";
    document.getElementById("gauge").style.opacity = ".35";
  }
  document.getElementById("k-hit").innerHTML = settled.length
    ? `${hits}<span class="u">/${settled.length}</span>` : "—";
  document.getElementById("k-pts").textContent = pts || "—";
  const pl = document.getElementById("k-pl");
  pl.textContent = settled.length ? yen(ret - cost) : "—";
  pl.style.color = settled.length && ret >= cost ? "var(--good)" : "var(--bad)";

  const box = document.getElementById("days");
  box.textContent = "";
  if(!days.length){
    box.appendChild(el("p","empty","まだ記録がありません。"));
  }
  for(const d of days){
    const sec = el("div","day");
    const head = el("div","dhead");
    head.appendChild(el("h3", null, fmtDate(d.date)));
    const dp = (d.picks||[]);
    const ds = dp.filter(p=>p.hit===true||p.hit===false);
    const dcost = ds.reduce((s,p)=>s+(p.cost||0),0);
    const dret  = ds.reduce((s,p)=>s+(p.ret||0),0);
    head.appendChild(el("span","dsum",
      ds.length ? `${dp.length}R  ${pct(dret/dcost)}  ${yen(dret-dcost)}`
                : `${dp.length}R  結果待ち`));
    sec.appendChild(head);

    if(!dp.length){
      sec.appendChild(el("p","empty","この日は買い目が出ませんでした（正常です）。"));
    }
    for(const p of dp){
      const cls = p.hit === true ? "race hit" : (p.hit === false ? "race miss" : "race");
      const r = el("div", cls);
      const h = el("div","rhead");
      h.appendChild(el("span","place", p.place || p.jcd));
      h.appendChild(el("span","rno", `${p.rno}R`));
      h.appendChild(el("span","rno", `締切 ${p.close || "—"}`));
      h.appendChild(el("span", "tag " + (p.hit===true?"hit":p.hit===false?"miss":"wait"),
        p.hit===true ? `的中 ${yen(p.ret)}` : p.hit===false ? "不的中" : "結果待ち"));
      r.appendChild(h);

      const bs = el("div","buys");
      for(const b of (p.buys||[])){
        const won = p.combo && b.combo === p.combo;
        const e = el("span","buy" + (won ? " won" : ""));
        e.appendChild(document.createTextNode(b.combo));
        const q = el("span","pq", `p/q ${Number(b.pq).toFixed(2)}`);
        e.appendChild(q);
        bs.appendChild(e);
      }
      r.appendChild(bs);

      const m = el("div","meta");
      if(p.wave !== undefined && p.wave !== null)
        m.appendChild(el("span", null, `波 ${p.wave}cm  風 ${p.wind}m`));
      m.appendChild(el("span", null, `${(p.buys||[]).length}点 ${yen(p.cost||0)}`));
      if(p.combo) m.appendChild(el("span", null, `結果 ${p.combo}  払戻 ${yen(p.pay||0)}`));
      r.appendChild(m);
      sec.appendChild(r);
    }

    if(d.skipped && Object.keys(d.skipped).length){
      const sk = el("div","skips");
      const total = Object.values(d.skipped).reduce((a,b)=>a+b,0);
      sk.appendChild(el("span","skip", `見送り ${total}`));
      const keys = SKIP_ORDER.filter(k => d.skipped[k])
        .concat(Object.keys(d.skipped).filter(k => !SKIP_ORDER.includes(k) && d.skipped[k]));
      for(const k of keys){
        const s = el("span","skip", k);
        s.appendChild(el("b", null, d.skipped[k]));
        sk.appendChild(s);
      }
      sec.appendChild(sk);
    }
    box.appendChild(sec);
  }

  document.getElementById("foot").textContent =
    "更新 " + (data.updated ? data.updated.replace("T"," ").slice(0,16) : "—");
}

function fail(msg){
  document.getElementById("lead").textContent = msg;
  document.getElementById("sum-note").textContent = "";
}

if(window.__DATA__){
  render(window.__DATA__);
}else{
  fetch("history.json?" + Date.now())
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(render)
    .catch(e => fail("history.json を読めません（" + e + "）。まだ1件も通知が出ていないか、まだ commit されていません。"));
}
</script>
</body>
</html>
