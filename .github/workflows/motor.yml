name: motor
# モーター純度を1日1回だけ作って commit する。
# v23 は15分ループのたびに v22 の kfile を sparse checkout していたが、
# 10分ループでそれをやると重すぎるので分離した。
on:
  schedule:
    - cron: "0 21 * * *"      # UTC 21:00 = JST 6:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  motor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy
      - name: v22 の Kファイルと確定オッズを取る
        # raw は settle.py が「通知時オッズ → 確定オッズ」を測るのに使う。
        # 手元に無ければ settle.py が raw.githubusercontent から1日ぶんだけ
        # 取りに行くが、ここで置いておけばネットに頼らずに済む。
        uses: actions/checkout@v4
        with:
          repository: honda1986/v22
          path: v22src
          sparse-checkout: |
            kfile
            raw
      - name: モーター純度を作る
        run: |
          python motor.py --kfile v22src/kfile --days 400 --out motor/latest.json
          python -c "import json,sys; j=json.load(open('motor/latest.json')); n=len(j.get('values') or {}); print('モーター純度', j.get('date'), n, '人'); sys.exit(0 if n>=500 else 1)"
      - name: 買った記録に結果とオッズの目減りを入れる（予想サイト用）
        run: python settle.py --kfile v22src/kfile --raw v22src/raw || true
      - name: commit
        run: |
          git config user.name  github-actions
          git config user.email github-actions@github.com
          BR="${GITHUB_REF_NAME:-main}"
          # ★git に JSON を混ぜさせない（メモ §26）。リモートを取り直して
          #   自分のぶんを意味を見て足す。settle の的中・払戻を消さないため。
          git fetch -q origin "$BR"
          T=$(mktemp -d)
          cp -a history.json "$T"/ 2>/dev/null || true
          cp -a motor "$T"/ 2>/dev/null || true
          git rebase --quit >/dev/null 2>&1 || true
          git checkout -q -B "$BR"
          git reset -q --hard "origin/$BR"
          mkdir -p motor
          cp -a "$T/motor/." motor/ 2>/dev/null || true
          if [ -f "$T/history.json" ]; then
            python merge_history.py "$T/history.json" history.json || \
              cp -a "$T/history.json" history.json
          fi
          rm -rf "$T"
          for p in motor/latest.json history.json; do
            [ -e "$p" ] && git add "$p"
          done
          git status --short
          git diff --cached --quiet || git commit -m "motor+settle: $(date -u +%Y%m%d)"
          git push origin "HEAD:$BR"
