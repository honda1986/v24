name: preflight
# 本番に金を入れる前の関門を全部実行する。手で回す用。
on:
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy requests beautifulsoup4
      - name: v22 の kfile だけ取ってくる(払戻金の検算に要る)
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/honda1986/v22.git /tmp/v22
          cd /tmp/v22 && git sparse-checkout set kfile
      - name: 関門
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python preflight.py --kfile /tmp/v22/kfile --days 4 --per-day 8
