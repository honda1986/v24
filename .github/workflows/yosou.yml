name: yosou
# ★PC が止まっているあいだだけ、GitHub が代わりに回す（予備運転。2026-11-04〜）
#
#   10分おきに起きて、PC の心拍（state/alive_pc.json）を見る。
#   ・PC が15分以内に動いていれば、数秒で終わる（何もしない）
#   ・止まっていれば standby.py が3分おきに予想を回す。毎周 PC の心拍を見て、
#     PC が戻ったら止まる。PC は GitHub が回しているあいだ予想を控える
#     （runner.py の gh_running）。なので両方が同時に通知することはない
#   ・朝の motor / prefetch も、その日まだ誰もやっていなければ1回だけやる
#
#   GitHub の定期実行は遅れたり間引かれたりする（実測で2〜6時間空いた日がある）。
#   なので1回起きたら最長5時間半回し続け、時間切れでもまだ PC が止まっていれば
#   自分で次のジョブを起こす。
#
#   手動の Run workflow は、force にチェックを入れると PC が動いていても
#   GitHub が引き継ぐ（PC はそのあいだ予想を控える）。
#   公開リポジトリなので Actions の実行時間に上限は無い。
on:
  schedule:
    - cron: "*/10 23,0-14 * * *"     # UTC 23:00〜14:59 = JST 8:00〜23:59 の10分おき
  workflow_dispatch:
    inputs:
      force:
        description: "PC が動いていても GitHub が引き継ぐ"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write        # 時間切れのとき次のジョブを起こす

concurrency:
  group: yosou
  cancel-in-progress: false

jobs:
  standby:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: PC が動いているか
        id: chk
        run: python standby.py --check ${{ inputs.force && '--force' || '' }}
      - name: ライブラリ
        if: steps.chk.outputs.need == '1'
        run: pip install numpy lightgbm requests beautifulsoup4
      - name: v22 の Kファイルと確定オッズ（朝の motor・結果の取り込みに要る）
        if: steps.chk.outputs.need == '1'
        uses: actions/checkout@v4
        with:
          repository: honda1986/v22
          path: v22src
          sparse-checkout: |
            kfile
            raw
      - name: 予備運転（PC が戻るか時間切れまで）
        id: run
        if: steps.chk.outputs.need == '1'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PYTHONUTF8: "1"
        run: |
          git config user.name  github-actions
          git config user.email github-actions@github.com
          python standby.py --v22 v22src ${{ inputs.force && '--force' || '' }}
      - name: 次のジョブを起こす（まだ PC が止まっているとき）
        if: steps.run.outputs.chain == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run yosou.yml --ref "${GITHUB_REF_NAME}" ${{ inputs.force && '-f force=true' || '' }}
