name: yosou
# ★GitHub の定期実行は当てにならない。
#   "*/10" と書いても混雑時は間引かれ、実測で 06:22→08:39→10:36→16:36 と
#   2〜6時間空いた。10分ごとという前提が成り立たない。
#
#   なので「何回起動するか」ではなく「1回をどれだけ長く回すか」に変えた。
#   1日4回だけ起動し、そのジョブの中で3分おきに回し続ける。
#   起動が多少遅れても、走り出せばその日の残りを拾える。
#
#   公開リポジトリなので Actions の実行時間に上限は無い。
on:
  schedule:
    - cron: "0 23 * * *"      # JST 08:00
    - cron: "0 2 * * *"       # JST 11:00
    - cron: "0 5 * * *"       # JST 14:00
    - cron: "0 8 * * *"       # JST 17:00
    - cron: "0 11 * * *"      # JST 20:00（ミッドナイトの後半）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yosou
  cancel-in-progress: false

jobs:
  yosou:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy lightgbm requests beautifulsoup4
      - name: 3分おきに回し続ける（最終レースまで）
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          git config user.name  github-actions
          git config user.email github-actions@github.com
          # 終わりは「185分後」か「日本時間23:59」の早いほう。
          # ★ミッドナイトは23時台まで走る（若松・大村・丸亀は海水場＝対象）。
          #   20:50 で切ると後半を丸ごと落とす。
          END=$(( $(date +%s) + 11100 ))
          LAST=$(TZ=Asia/Tokyo date -d "today 23:59" +%s 2>/dev/null || echo 0)
          [ "$LAST" -gt 0 ] && [ "$LAST" -lt "$END" ] && END=$LAST
          echo "JST $(TZ=Asia/Tokyo date +%H:%M) に開始。$(TZ=Asia/Tokyo date -d @$END +%H:%M) まで回します"
          i=0
          while [ "$(date +%s)" -lt "$END" ]; do
            i=$((i+1))
            echo "--- $i 回目  JST $(TZ=Asia/Tokyo date +%H:%M) ---"
            python yosou.py --budget 150 || echo "  (この回は失敗。次にまわします)"
            # ★1周ごとに記録を残す。まとめて最後だと落ちた回が消える
            for p in state cache history.json; do
              [ -e "$p" ] && git add -A "$p"
            done
            if ! git diff --cached --quiet; then
              git commit -q -m "state: $(TZ=Asia/Tokyo date +%H%M)"
              git pull --rebase --autostash -q || true
              git push -q || echo "  push できず(次周に持ち越し)"
            fi
            sleep 180
          done
          echo "$i 回まわしました"
          exit 0
