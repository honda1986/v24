name: prefetch
# 当日ぶんの出走表を朝のうちに取って cache に入れておく。
# info.kyotei.fun は Actions から時々まったく届かないので、
# 締切直前の短い窓でそれに当たらないようにする保険。
# 3時間おきに回して、取れなかったぶんを埋めていく。
on:
  schedule:
    - cron: "0 22,1,4 * * *"      # JST 7時 / 10時 / 13時
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prefetch
  cancel-in-progress: false

jobs:
  prefetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy requests beautifulsoup4
      - run: python prefetch.py || true
      - name: cache を残す
        run: |
          git config user.name  github-actions
          git config user.email github-actions@github.com
          BR="${GITHUB_REF_NAME:-main}"
          # ★rebase が止まると HEAD が枝から外れ、以後 push できなくなる（§18）
          if ! git symbolic-ref -q HEAD >/dev/null; then
            git rebase --quit >/dev/null 2>&1 || true
            git checkout -q -B "$BR"
          fi
          for p in cache; do
            [ -e "$p" ] && git add -A "$p"
          done
          git diff --cached --quiet || git commit -m "prefetch: $(date -u +%Y%m%d-%H%M)"
          git fetch -q origin "$BR" || true
          git rebase -q "origin/$BR" || {
            echo "★衝突。こちらを優先します"
            git rebase --abort >/dev/null 2>&1 || true
            git rebase -q -X theirs "origin/$BR" || git rebase --abort || true
          }
          git push origin "HEAD:$BR" || echo "push できませんでした(次回に持ち越し)"
